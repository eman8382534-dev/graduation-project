<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Growia - Reset Hero Password</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ── Card ── */
    .reset-card {
      background: rgba(255,255,255,0.95);
      border-radius: var(--radius-xl);
      padding: 36px;
      width: 95%; max-width: 420px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      text-align: center;
      animation: fadeIn 0.5s ease-out;
      position: relative; z-index: 10;
    }

    .card-icon     { font-size: 50px; margin-bottom: 10px; display: block; }
    .card-title    { color: var(--teal); margin: 0 0 5px; font-size: 24px; font-family: var(--font-display); }
    .card-subtitle { color: var(--teal-light, #5a9dac); font-size: 14px; margin-bottom: 20px; font-weight: 600; }

    /* ── Error banner (DOM-based, replaces all alert() calls) ── */
    #errorBanner {
      display: none;
      background: linear-gradient(135deg, #fff0f0, #ffe0e0);
      border: 1.5px solid #f5a0a0;
      border-radius: var(--radius-md);
      color: #c0392b;
      font-size: 13px;
      font-weight: 700;
      padding: 10px 14px 10px 36px;
      margin-bottom: 16px;
      text-align: left;
      position: relative;
    }
    #errorBanner::before {
      content: '⚠️';
      position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
      font-size: 14px;
    }

    /* ── Success banner ── */
    #successBanner {
      display: none;
      background: linear-gradient(135deg, #f0fff8, #d4f5e8);
      border: 1.5px solid #6fcf97;
      border-radius: var(--radius-md);
      color: #1a7a4a;
      font-size: 13px;
      font-weight: 700;
      padding: 10px 14px 10px 36px;
      margin-bottom: 16px;
      text-align: left;
      position: relative;
    }
    #successBanner::before {
      content: '✅';
      position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
      font-size: 14px;
    }

    /* ── Form ── */
    .form-group { text-align: left; margin-bottom: 15px; }
    .form-label { display: block; font-weight: 700; color: var(--text-dark); margin-bottom: 6px; font-size: 13px; }

    .form-input {
      width: 100%; padding: 12px 18px; box-sizing: border-box;
      border: 2px solid #edf2f7;
      border-radius: var(--radius-full);
      font-family: var(--font-main); font-size: 16px;
      transition: 0.3s; outline: none;
    }
    .form-input:focus { border-color: var(--teal); background: white; }
    .form-input.valid { border-color: #48bb78; background: #f0fff4; }
    .form-input.error { border-color: var(--red-alert); background: #fff5f5; }

    .field-msg { font-size: 11px; font-weight: 700; margin: 4px 0 0 6px; display: block; min-height: 15px; }

    /* ── Submit button ── */
    #submitBtn {
      width: 100%; padding: 15px;
      background: var(--yellow); color: var(--text-dark);
      border: none; border-radius: var(--radius-full);
      font-family: var(--font-main); font-weight: 800; font-size: 16px;
      cursor: pointer; transition: 0.2s; margin-top: 10px;
    }
    #submitBtn:hover:not(:disabled) { background: var(--yellow-dark); transform: translateY(-2px); }
    #submitBtn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Loading spinner */
    @keyframes btnSpin { to { transform: rotate(360deg); } }
    .btn-spinner {
      display: inline-block; width: 16px; height: 16px;
      border: 2.5px solid rgba(44,62,80,0.25); border-top-color: var(--text-dark);
      border-radius: 50%; animation: btnSpin 0.7s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }

    /* ── Ground decoration ── */
    .ground { position: absolute; bottom: 0; width: 100%; z-index: 1; }
    .fence  { height: 30px; background: repeating-linear-gradient(90deg, white 0, white 15px, transparent 15px, transparent 25px); border-top: 5px solid white; }
    .grass  { background: linear-gradient(to bottom, #7ec850, #5ca830); height: 40px; }
  </style>
</head>
<body>

<!-- Garden decorations -->
<div class="sun-wrap" style="position:absolute;top:20px;right:20px;z-index:5;">☀️</div>
<div class="cloud-shape" style="top:60px;left:50px;width:90px;height:35px;">
  <span style="display:block;position:absolute;width:45px;height:45px;background:white;border-radius:50%;top:-15px;left:15px;"></span>
</div>

<div class="reset-card">
  <span class="card-icon">🔐</span>
  <h2 class="card-title">New Secret Password</h2>
  <p class="card-subtitle" id="cardSubtitle">Enter your 6-digit code and choose a new password!</p>

  <!-- DOM-based error banner — zero alert() calls -->
  <div id="errorBanner"   role="alert"  aria-live="assertive" aria-atomic="true"></div>
  <div id="successBanner" role="status" aria-live="polite"    aria-atomic="true"></div>

  <!-- 6-digit reset code (provided by parent from their dashboard) -->
  <div class="form-group">
    <label class="form-label" for="resetCode">Secret 6-Digit Code</label>
    <input
      type="text"
      id="resetCode"
      class="form-input"
      placeholder="Check with Parent"
      maxlength="6"
      inputmode="numeric"
      autocomplete="one-time-code"
    >
    <span id="msg-code" class="field-msg"></span>
  </div>

  <!-- New password -->
  <div class="form-group">
    <label class="form-label" for="newPass">New Magic Password</label>
    <input
      type="password"
      id="newPass"
      class="form-input"
      placeholder="Enter 6+ characters"
      autocomplete="new-password"
      maxlength="128"
    >
    <span id="msg-newPass" class="field-msg"></span>
  </div>

  <!-- Confirm password -->
  <div class="form-group">
    <label class="form-label" for="confirmPass">Confirm Magic Password</label>
    <input
      type="password"
      id="confirmPass"
      class="form-input"
      placeholder="Repeat it here"
      autocomplete="new-password"
      maxlength="128"
    >
    <span id="msg-confirmPass" class="field-msg"></span>
  </div>

  <button id="submitBtn" onclick="doReset()">Update &amp; Enter 🌱</button>
  <br>
  <a href="child_login.html" class="back-link" style="margin-top:15px;font-size:13px;display:inline-block;">← Back to Login</a>
</div>

<div class="ground">
  <div class="fence"></div>
  <div class="grass"></div>
</div>

<script src="script.js"></script>
<script>
  'use strict';

  /* ══════════════════════════════════════════════════════════
     SYNCHRONOUS AUTH GUARD — IIFE
     This page is only reachable after the challenge-login
     flow which stores an intermediate token via setChildToken().
     If there is no token at all, the child has no business
     being on this page — send them back to login.
  ══════════════════════════════════════════════════════════ */
  (function guardChallengePage() {
    if (!getChildToken()) {
      window.location.replace('child_login.html');
    }
  })();

  /* ══════════════════════════════════════════════════════════
     URL PARAM — extract username safely on load
     The login page set ?username=... via encodeURIComponent,
     so we decode it here before any DOM interaction.
  ══════════════════════════════════════════════════════════ */
  const _username = (function extractUsername() {
    try {
      const raw = new URLSearchParams(window.location.search).get('username');
      return raw ? decodeURIComponent(raw) : null;
    } catch {
      return null;
    }
  })();

  // If there is no username in the URL something went wrong — redirect cleanly
  if (!_username) {
    clearChildToken();
    window.location.replace('child_login.html');
  }

  /* ══════════════════════════════════════════════════════════
     DOM READY — personalise the subtitle with the hero's name
  ══════════════════════════════════════════════════════════ */
  document.addEventListener('DOMContentLoaded', () => {
    const subtitle = document.getElementById('cardSubtitle');
    if (subtitle && _username) {
      subtitle.textContent =
        `Hey ${_username}! Enter the code your parent gave you and set a new password.`;
    }
    // Auto-focus the code field
    document.getElementById('resetCode').focus();
  });

  /* ══════════════════════════════════════════════════════════
     INLINE FIELD VALIDATION — live feedback as the child types
  ══════════════════════════════════════════════════════════ */
  const passRegex = /^.{6,}$/;

  document.getElementById('resetCode').addEventListener('input', function () {
    // Strip non-numeric characters as they type
    this.value = this.value.replace(/[^0-9]/g, '');
    if (this.value.length === 6) {
      setFieldStatus(this, 'msg-code', 'Code entered ✅', true);
    } else {
      setFieldStatus(this, 'msg-code', 'Enter the 6-digit code from your parent', false);
    }
  });

  document.getElementById('newPass').addEventListener('input', function () {
    if (passRegex.test(this.value)) {
      setFieldStatus(this, 'msg-newPass', 'Great password! 💪', true);
    } else {
      setFieldStatus(this, 'msg-newPass', 'Must be at least 6 characters', false);
    }
    validateConfirmMatch();
  });

  document.getElementById('confirmPass').addEventListener('input', validateConfirmMatch);

  function validateConfirmMatch() {
    const passEl    = document.getElementById('newPass');
    const confirmEl = document.getElementById('confirmPass');
    if (!confirmEl.value) {
      setFieldStatus(confirmEl, 'msg-confirmPass', '', false);
      return;
    }
    if (confirmEl.value === passEl.value) {
      setFieldStatus(confirmEl, 'msg-confirmPass', 'Passwords match! ✅', true);
    } else {
      setFieldStatus(confirmEl, 'msg-confirmPass', 'Passwords do not match yet', false);
    }
  }

  function setFieldStatus(inputEl, spanId, msg, isValid) {
    const span = document.getElementById(spanId);
    if (span) {
      span.textContent = msg;
      span.style.color = isValid ? '#48bb78' : (msg ? '#e53e3e' : '');
    }
    inputEl.classList.toggle('valid',  isValid);
    inputEl.classList.toggle('error', !isValid && msg !== '');
  }

  /* ══════════════════════════════════════════════════════════
     BANNER HELPERS — zero alert() calls anywhere in this file
  ══════════════════════════════════════════════════════════ */
  function showErrorBanner(message) {
    const el = document.getElementById('errorBanner');
    el.textContent   = message;
    el.style.display = 'block';
    document.getElementById('successBanner').style.display = 'none';
  }

  function showSuccessBanner(message) {
    const el = document.getElementById('successBanner');
    el.textContent   = message;
    el.style.display = 'block';
    document.getElementById('errorBanner').style.display = 'none';
  }

  function hideBanners() {
    document.getElementById('errorBanner').style.display   = 'none';
    document.getElementById('successBanner').style.display = 'none';
  }

  /* ══════════════════════════════════════════════════════════
     CLIENT-SIDE VALIDATION BEFORE FETCH
  ══════════════════════════════════════════════════════════ */
  function validateForm() {
    const codeEl    = document.getElementById('resetCode');
    const passEl    = document.getElementById('newPass');
    const confirmEl = document.getElementById('confirmPass');

    let valid = true;

    if (!codeEl.value || codeEl.value.length !== 6) {
      setFieldStatus(codeEl, 'msg-code', 'Please enter the 6-digit code from your parent', false);
      valid = false;
    }
    if (!passRegex.test(passEl.value)) {
      setFieldStatus(passEl, 'msg-newPass', 'Password must be at least 6 characters', false);
      valid = false;
    }
    if (passEl.value !== confirmEl.value) {
      setFieldStatus(confirmEl, 'msg-confirmPass', 'Passwords do not match', false);
      valid = false;
    }
    return valid;
  }

  /* ══════════════════════════════════════════════════════════
     MAIN SUBMIT — doReset()
     POST /Auth/reset-child-password-final
     Body: { UserName, Code, NewPassword }    (matches CompleteResetDto)
     Headers: Authorization Bearer + X-Device-Fingerprint
     On success: update childToken with the fresh JWT → go to leafy.html
     On failure: surface message in DOM banner, no alert()
  ══════════════════════════════════════════════════════════ */
  async function doReset() {
    hideBanners();
    if (!validateForm()) return;

    const btn = document.getElementById('submitBtn');
    btn.disabled  = true;
    btn.innerHTML = '<span class="btn-spinner" aria-hidden="true"></span>Saving…';

    const intermediateToken = getChildToken();

    try {
      const response = await fetch(`${API_BASE_URL}/Auth/reset-child-password-final`, {
        method: 'POST',
        headers: {
          'Content-Type':         'application/json',
          'X-Device-Fingerprint': getOrCreateDeviceId(),
          // The intermediate token stored during the challenge-login flow
          // is required to prove this request is coming from the right session.
          'Authorization':        `Bearer ${intermediateToken}`
        },
        body: JSON.stringify({
          UserName:    _username,
          Code:        document.getElementById('resetCode').value,
          NewPassword: document.getElementById('newPass').value
        })
      });

      let result;
      try {
        result = await response.json();
      } catch {
        throw new Error('Unexpected server response. Please try again.');
      }

      if (response.ok) {
        // Replace the intermediate/challenge token with the fresh post-reset JWT
        if (result.token) {
          setChildToken(result.token);
        } else {
          // No fresh token means the child must log in cleanly
          clearChildToken();
        }

        showSuccessBanner('Password updated! Taking you to your garden… 🌱');

        // Short delay so the child can read the success message
        setTimeout(() => {
          window.location.href = result.token ? 'leafy.html' : 'child_login.html';
        }, 1200);

      } else {
        // ── Handle structured backend errors ──

        if (result.errors) {
          // ModelState-style validation errors
          Object.keys(result.errors).forEach(key => {
            // Normalise key to match our input IDs
            let inputId = key.charAt(0).toLowerCase() + key.slice(1);
            let msgId   = 'msg-' + inputId;

            if (inputId === 'newPassword') { inputId = 'newPass';   msgId = 'msg-newPass';   }
            if (inputId === 'code')        { inputId = 'resetCode'; msgId = 'msg-code';      }
            if (inputId === 'userName')    { inputId = 'resetCode'; msgId = 'msg-code';      }

            const inputEl = document.getElementById(inputId);
            if (inputEl) {
              setFieldStatus(inputEl, msgId, result.errors[key][0], false);
            } else {
              // Field not found — surface in the global banner
              showErrorBanner(result.errors[key][0]);
            }
          });

          // If code is wrong, also highlight the code field generically
          if (!result.errors['Code'] && !result.errors['code']) {
            // Show the server message in the banner as a fallback
            if (result.message) showErrorBanner(result.message);
          }

        } else if (result.message) {
          // Simple message (e.g. "Invalid code or reset not requested!")
          // Most likely the code is wrong — highlight that field
          const codeEl = document.getElementById('resetCode');
          setFieldStatus(codeEl, 'msg-code', result.message, false);
          showErrorBanner(result.message);

        } else {
          showErrorBanner(`Something went wrong (error ${response.status}). Please try again.`);
        }
      }

    } catch (err) {
      const isParseErr = err?.message?.includes('Unexpected server');
      showErrorBanner(
        isParseErr
          ? err.message
          : 'Could not reach the server. Check your connection and try again. 🌐'
      );
    } finally {
      btn.disabled     = false;
      btn.textContent  = 'Update & Enter 🌱';
    }
  }
</script>
</body>
</html>
