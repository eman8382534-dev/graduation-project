<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Growth Journey</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Fredoka', sans-serif; }

        body {
            background-color: #d9e87a;
            background-image: radial-gradient(circle, rgba(255,255,255,0.18) 2px, transparent 2px);
            background-size: 36px 36px;
            min-height: 100vh;
            padding: 20px 16px 80px;
            overflow-x: hidden;
        }

        /* ── Header ── */
        .top-bar { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 18px; }
        .back-btn {
            background: #e8a800; color: #fff; border: none;
            padding: 8px 18px; border-radius: 20px; font-weight: 700;
            font-size: 14px; cursor: pointer; font-family: 'Fredoka', sans-serif;
            box-shadow: 0 4px 0 #b07800; text-decoration: none;
            transition: all .1s; white-space: nowrap;
        }
        .back-btn:active { transform: translateY(3px); box-shadow: none; }
        .header-text h1 { color: #e6536f; font-size: 2.1rem; font-weight: 700; }
        .header-text .subtitle { color: #4a8e8e; font-size: .92rem; font-weight: 600; margin-top: 2px; }

        /* ── Encourage banner ── */
        .encourage-banner {
            background: #ffe4ec; border-radius: 20px;
            padding: 14px 22px; text-align: center;
            font-size: .95rem; font-weight: 700; color: #c94070;
            margin: 0 auto 20px; max-width: 560px;
        }
        .encourage-banner .sub { font-size: .82rem; font-weight: 600; color: #4a8e8e; margin-top: 3px; }

        /* ── Tree layout ── */
        .journey-tree {
            position: relative;
            max-width: 680px;
            margin: 0 auto;
            padding: 10px 0 30px;
        }

        .connector-svg {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; overflow: visible;
        }

        /* ── Row ── */
        .lv-row {
            display: flex; align-items: flex-start;
            margin-bottom: 26px; position: relative; z-index: 2;
        }
        .lv-row.left  { flex-direction: row;         justify-content: flex-start;  padding-left: 20px; }
        .lv-row.right { flex-direction: row-reverse; justify-content: flex-start;  padding-right: 20px; }

        /* ── Node ── */
        .lv-node {
            width: 58px; height: 58px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; font-weight: 700; flex-shrink: 0;
            position: relative; margin-top: 14px;
        }
        .lv-node.done   { background: #FFD97D; box-shadow: 0 4px 0 #c49a00; }
        .lv-node.active { background: #FFD97D; box-shadow: 0 0 0 8px rgba(255,217,125,.35), 0 4px 0 #c49a00; animation: pulse 2s infinite; }
        .lv-node.locked { background: #c8c8c8; box-shadow: 0 4px 0 #aaa; }
        @keyframes pulse {
            0%,100%{ box-shadow: 0 0 0 8px rgba(255,217,125,.35), 0 4px 0 #c49a00; }
            50%    { box-shadow: 0 0 0 16px rgba(255,217,125,.12), 0 4px 0 #c49a00; }
        }

        /* ── Card ── */
        .lv-card {
            border-radius: 22px; padding: 14px 16px;
            max-width: 268px; min-width: 210px;
            box-shadow: 0 4px 18px rgba(0,0,0,.10);
            position: relative;
        }
        .lv-row.left  .lv-card { margin-left: 16px; }
        .lv-row.right .lv-card { margin-right: 16px; }

        .card-icon-row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
        .card-big-icon { font-size: 2rem; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
        .card-title { font-size: .98rem; font-weight: 700; line-height: 1.25; }
        .card-date  { font-size: .7rem; font-weight: 600; color: #aaa; margin-top: 2px; }

        .card-quote-row { display: flex; align-items: flex-start; gap: 7px; margin: 8px 0 6px; }
        .card-leaf  { font-size: 1.1rem; flex-shrink: 0; margin-top: 1px; }
        .card-quote { font-size: .8rem; font-style: italic; color: #666; line-height: 1.4; }

        /* ── Progress bar at bottom of card ── */
        .card-progress-row { display: flex; align-items: center; gap: 7px; margin-top: 6px; }
        .card-progress-bar { flex: 1; height: 7px; background: #f0f0f0; border-radius: 4px; overflow: hidden; }
        .card-progress-fill { height: 100%; border-radius: 4px; transition: width .7s ease; }
        .card-challenges { font-size: .7rem; font-weight: 700; color: #aaa; white-space: nowrap; }

        /* ── Inline challenges list ── */
        .challenges-section {
            margin-top: 10px;
            display: none; /* hidden by default */
            animation: fadeIn .2s ease;
        }
        .challenges-section.open { display: block; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:translateY(0); } }

        .challenges-label {
            font-size: .78rem; font-weight: 700;
            margin-bottom: 6px; display: flex; align-items: center; gap: 5px;
        }

        /* tap hint shown at bottom of card */
        .card-tap-hint {
            text-align: center; font-size: .68rem; color: #bbb;
            margin-top: 7px; letter-spacing: .3px;
            transition: opacity .2s;
        }
        .lv-card.expanded .card-tap-hint { opacity: 0; height: 0; margin: 0; overflow: hidden; }

        /* card clickable */
        .lv-card { cursor: pointer; transition: transform .15s, box-shadow .15s; }
        .lv-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.13); }
        .lv-card.expanded { box-shadow: 0 8px 28px rgba(0,0,0,.15); }

        .chal-item {
            display: flex; align-items: center; gap: 8px;
            padding: 5px 0; border-bottom: 1px solid rgba(0,0,0,.05);
            font-size: .8rem;
        }
        .chal-item:last-child { border-bottom: none; }
        .chal-icon { font-size: 1rem; flex-shrink: 0; width: 20px; text-align: center; }
        .chal-body { flex: 1; }
        .chal-text { line-height: 1.3; }
        .chal-text.done-text { text-decoration: line-through; color: #aaa; }
        .chal-text.locked-text { color: #ccc; }

        .chal-bar-wrap { height: 4px; background: rgba(0,0,0,.08); border-radius: 2px; overflow: hidden; margin-top: 3px; }
        .chal-bar-fill { height: 100%; border-radius: 2px; transition: width .5s; }
        .chal-prog { font-size: .68rem; color: #999; white-space: nowrap; flex-shrink: 0; }
        .chal-num {
            background: rgba(0,0,0,.07); border-radius: 50%;
            width: 20px; height: 20px; font-size: .72rem; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            color: #888; flex-shrink: 0;
        }

        /* ── Score stats bar ── */
        .score-stats {
            display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
            max-width: 560px; margin: 0 auto 18px;
        }
        .score-pill {
            background: #fff; border-radius: 16px; padding: 10px 18px;
            box-shadow: 0 3px 12px rgba(0,0,0,.08); text-align: center; min-width: 120px;
        }
        .score-pill .sp-val { font-size: 1.35rem; font-weight: 700; color: #e6536f; }
        .score-pill .sp-lbl { font-size: .72rem; color: #888; font-weight: 600; margin-top: 2px; }
        .score-pill.trust .sp-val { color: #10b981; }
    </style>
</head>
<body>

<div class="top-bar">
    <a href="leafy.html" class="back-btn">← Back to Home</a>
    <div class="header-text">
        <h1>My Growth Journey</h1>
        <div class="subtitle">Climb every level to become a Garden Legend!</div>
    </div>
</div>

<div class="encourage-banner" id="encourageBanner">
    🌸 Keep going! Your garden is growing beautifully! 🌸
    <div class="sub">Every level brings new challenges and rewards.</div>
</div>

<div class="score-stats" id="scoreStats" style="display:none;">
    <div class="score-pill trust">
        <div class="sp-val" id="trustScoreVal">–</div>
        <div class="sp-lbl">Trust Score</div>
    </div>
    <div class="score-pill">
        <div class="sp-val" id="meanScoreVal">–</div>
        <div class="sp-lbl">Mean Score</div>
    </div>
    <div class="score-pill">
        <div class="sp-val" id="finalMeanScoreVal">–</div>
        <div class="sp-lbl">Level Gate Score</div>
    </div>
</div>

<div class="journey-tree" id="journeyTree"></div>

<script src="script.js"></script>
<script>
// ── PHASE 10: All level data now comes from the API (DB-driven Levels + BadgeChallenges) ──
const SIDES = ['left','right','left','right','left','right'];
let _lastLevel = 1;

async function loadJourney() {
    let data = {};
    try {
        if (typeof childAuthFetch === 'function') {
            const res = await childAuthFetch('/Children/journey-progress');
            if (res && res.ok) data = await res.json();
        }
    } catch(e) { console.warn('journey fetch error', e); }

    const currentLevel  = data.currentLevel         || 1;
    const levelDefs     = Array.isArray(data.levelDefinitions) ? data.levelDefinitions : [];

    _lastLevel = currentLevel;

    document.getElementById('encourageBanner').innerHTML =
        currentLevel >= 6
        ? `🌟 You are a Grawiaa Legend! You've done it! 🌟<div class="sub">All levels complete — you're amazing!</div>`
        : `🌸 Keep going! Your garden is growing beautifully! 🌸<div class="sub">Every level brings new challenges and rewards.</div>`;

    renderScoreStats(data);
    buildTree(currentLevel, levelDefs);
}

function renderScoreStats(data) {
    const statsEl = document.getElementById('scoreStats');
    if (!statsEl) return;

    const trust = data.trustScore;
    const mean = data.meanScore;
    const finalMean = data.finalMeanScore;

    if (trust == null && mean == null && finalMean == null) {
        statsEl.style.display = 'none';
        return;
    }

    statsEl.style.display = 'flex';

    const trustEl = document.getElementById('trustScoreVal');
    const meanEl = document.getElementById('meanScoreVal');
    const finalEl = document.getElementById('finalMeanScoreVal');

    if (trustEl) trustEl.textContent = trust != null ? trust + '/100' : '–';
    if (meanEl) meanEl.textContent = mean != null ? Math.round(mean * 10) / 10 : '–';
    if (finalEl) finalEl.textContent = finalMean != null ? Math.round(finalMean * 10) / 10 : '–';
}

function buildTree(currentLevel, levelDefs) {
    const tree = document.getElementById('journeyTree');
    tree.innerHTML = '';

    if (!levelDefs.length) {
        tree.innerHTML = '<p style="text-align:center;color:#aaa;padding:40px">Loading your journey...</p>';
        return;
    }

    levelDefs.forEach((lv, i) => {
        const isDone   = lv.isDone;
        const isActive = lv.isActive;
        const isLocked = lv.isLocked;
        const side = SIDES[i] || 'left';

        // ── Row ──────────────────────────────────────────────────────
        const row = document.createElement('div');
        row.className = `lv-row ${side}`;

        // ── Node ─────────────────────────────────────────────────────
        const node = document.createElement('div');
        node.className = `lv-node ${isDone ? 'done' : isActive ? 'active' : 'locked'}`;
        node.innerHTML = isDone ? '✓' : isLocked ? '🔒' : (lv.emoji || '⭐');

        // ── Card ─────────────────────────────────────────────────────
        const card = document.createElement('div');
        card.className = `lv-card ${isDone ? 'done' : isActive ? 'active' : 'locked'}`;
        card.style.background = lv.bgColor || '#fff';
        if (isLocked) card.style.opacity = '0.72';

        const challenges = Array.isArray(lv.challenges) ? lv.challenges : [];
        const reqDone  = isDone ? challenges.length : challenges.filter(c => c.completed).length;
        const reqTotal = challenges.length;
        const fillPct  = isDone ? 100 : (lv.progressPct || 0);
        const chalText = `${reqDone}/${reqTotal} challenges`;
        const titleColor = lv.titleColor || '#333';

        const barBg = isDone
            ? 'linear-gradient(90deg,#a8e063,#56ab2f)'
            : (lv.barColor || '#ddd');

        // Header
        card.innerHTML = `
            <div class="card-icon-row">
                <div class="card-big-icon">${lv.emoji || '⭐'}</div>
                <div>
                    <div class="card-title" style="color:${titleColor}">Level ${lv.levelNumber} — ${lv.name}</div>
                    <div class="card-date">${isDone ? 'Completed ✓' : isActive ? 'In Progress' : '–'}</div>
                </div>
            </div>
            <div class="card-quote-row">
                <span class="card-leaf">🌿</span>
                <span class="card-quote" style="color:#888">"${lv.quote || ''}"</span>
            </div>
            <div class="card-progress-row">
                <div class="card-progress-bar">
                    <div class="card-progress-fill" style="width:${fillPct}%;background:${barBg};"></div>
                </div>
                <span class="card-challenges">${chalText}</span>
            </div>
            <div class="card-tap-hint">👆 Tap to see challenges</div>
        `;

        // ── Challenges section ────────────────────────────────────────
        const section = document.createElement('div');
        section.className = 'challenges-section';

        const labelColor = isDone ? '#6a9e40' : isActive ? titleColor : '#ccc';
        section.innerHTML = `<div class="challenges-label" style="color:${labelColor}">
            ${isDone ? '✅' : isActive ? '🎯' : '🔒'} Challenges:
        </div>`;

        // PHASE 10 REFACTOR — DB-driven level requirements (required_badges /
        // min_trust_score) via ILevelRulesProvider, shown for active levels.
        // minTrustScoreNormalized is the spec-aligned 0.0-1.0 field from Level.MinTrustScore.
        // minTrustScore is the legacy 0-100 integer from LevelRulesProvider.
        if (isActive && lv.requiredBadges != null) {
            const reqLine = document.createElement('div');
            reqLine.className = 'challenges-label';
            reqLine.style.color = '#888';
            reqLine.style.fontSize = '.78rem';
            reqLine.style.fontWeight = '600';
            const badgePart = lv.requiredBadges > 0
                ? `${lv.requiredBadges} badge${lv.requiredBadges === 1 ? '' : 's'} required`
                : 'no badge requirement';

            // Prefer minTrustScoreNormalized (0.0-1.0 spec field) over minTrustScore (0-100)
            let trustDisplay = '';
            if (lv.minTrustScoreNormalized != null && lv.minTrustScoreNormalized > 0) {
                trustDisplay = `, Trust ≥ ${Math.round(lv.minTrustScoreNormalized * 100)}%`;
            } else if (lv.minTrustScore != null && lv.minTrustScore > 0) {
                trustDisplay = `, Trust Score ≥ ${lv.minTrustScore}`;
            }

            const metMark = lv.requiredBadgesMet ? ' ✅' : '';
            reqLine.textContent = `Requires: ${badgePart}${trustDisplay}${metMark}`;
            section.appendChild(reqLine);
        }

        challenges.forEach((ch, ci) => {
            const item = document.createElement('div');
            item.className = 'chal-item';

            if (isDone || ch.completed) {
                // Done — green tick + strikethrough
                item.innerHTML = `
                    <span class="chal-icon" style="color:#66bb6a;">✓</span>
                    <div class="chal-body">
                        <div class="chal-text done-text">${ch.text || ''}</div>
                    </div>`;
            } else if (isActive) {
                // Active & not done — number + optional progress bar for numeric targets
                const showBar = (ch.target || 0) > 1;
                const barPct  = showBar ? Math.min(100, Math.round((ch.current / ch.target) * 100)) : 0;
                item.innerHTML = `
                    <span class="chal-icon chal-num">${ci + 1}</span>
                    <div class="chal-body">
                        <div class="chal-text">${ch.text || ''}</div>
                        ${showBar ? `
                        <div class="chal-bar-wrap">
                            <div class="chal-bar-fill" style="width:${barPct}%;background:${titleColor};"></div>
                        </div>` : ''}
                    </div>
                    ${showBar ? `<span class="chal-prog">${Math.round(ch.current||0)}/${ch.target}</span>` : ''}`;
            } else {
                // Locked — number + greyed text
                item.innerHTML = `
                    <span class="chal-icon chal-num" style="color:#ccc;">${ci + 1}</span>
                    <div class="chal-body">
                        <div class="chal-text locked-text">${ch.text || ''}</div>
                    </div>`;
            }

            section.appendChild(item);
        });

        card.appendChild(section);

        // ── Toggle challenges on card click ──────────────────────────
        card.addEventListener('click', () => {
            const isOpen = section.classList.contains('open');
            // Close all other open cards first
            document.querySelectorAll('.challenges-section.open').forEach(s => {
                s.classList.remove('open');
                s.closest('.lv-card')?.classList.remove('expanded');
            });
            if (!isOpen) {
                section.classList.add('open');
                card.classList.add('expanded');
                // Redraw connectors since card height changed
                setTimeout(() => drawConnectors(_lastLevel), 50);
            }
        });

        row.appendChild(node);
        row.appendChild(card);
        tree.appendChild(row);
    });

    // SVG connector lines
    requestAnimationFrame(() => drawConnectors(currentLevel));
    window.addEventListener('resize', () => drawConnectors(_lastLevel));
}

function drawConnectors(currentLevel) {
    const tree = document.getElementById('journeyTree');
    const old  = tree.querySelector('.connector-svg');
    if (old) old.remove();

    const treeRect = tree.getBoundingClientRect();
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.classList.add('connector-svg');
    tree.prepend(svg);

    const nodeEls = Array.from(tree.querySelectorAll('.lv-node'));

    for (let i = 0; i < nodeEls.length - 1; i++) {
        const a = nodeEls[i].getBoundingClientRect();
        const b = nodeEls[i+1].getBoundingClientRect();
        const x1 = a.left + a.width/2  - treeRect.left;
        const y1 = a.top  + a.height/2 - treeRect.top;
        const x2 = b.left + b.width/2  - treeRect.left;
        const y2 = b.top  + b.height/2 - treeRect.top;

        const isDoneEdge   = currentLevel > i + 1;
        const isActiveEdge = currentLevel === i + 1;

        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', x1); line.setAttribute('y1', y1);
        line.setAttribute('x2', x2); line.setAttribute('y2', y2);
        line.setAttribute('stroke', (isDoneEdge || isActiveEdge) ? '#FFD97D' : '#ccc');
        line.setAttribute('stroke-width', isDoneEdge ? 5 : 3);
        line.setAttribute('stroke-linecap', 'round');
        if (!isDoneEdge && !isActiveEdge) line.setAttribute('stroke-dasharray', '8 6');
        svg.appendChild(line);
    }
}

loadJourney();
</script>
</body>
</html>
