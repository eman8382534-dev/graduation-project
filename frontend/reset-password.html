<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Growia - Reset Your Magic Password</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); }

    .page {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 20px; position: relative;
    }

    .reset-card {
      background: rgba(255,255,255,0.92); border-radius: var(--radius-xl);
      padding: 40px; width: 100%; max-width: 450px;
      box-shadow: var(--shadow-lg); text-align: center;
      position: relative; z-index: 10;
    }
    .card-title    { font-family: var(--font-display); font-size: 26px; color: var(--teal); margin-bottom: 8px; }
    .card-subtitle { font-size: 15px; color: var(--teal); margin-bottom: 25px; font-weight: 600; }

    .form-group  { text-align: left; margin-bottom: 18px; }
    .form-label  { display: block; font-weight: 600; color: var(--text-dark); margin-bottom: 8px; font-size: 14px; padding-left: 4px; }
    .form-input  {
      width: 100%; padding: 14px 18px; box-sizing: border-box;
      border: 2px solid #e2e8f0; border-radius: var(--radius-full);
      font-size: 16px; transition: all 0.2s; outline: none;
    }
    .form-input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(15,147,117,0.1); }

    /* Strength meter */
    .strength-meter { height: 6px; background: #e2e8f0; margin-top: 8px; border-radius: var(--radius-full); overflow: hidden; }
    .strength-bar   { height: 100%; width: 0; transition: 0.3s; border-radius: var(--radius-full); }
    .strength-text  { display: block; margin-top: 5px; font-size: 11px; color: #64748b; }

    .btn-update {
      width: 100%; padding: 15px; background: var(--yellow); color: var(--text-dark);
      border: none; border-radius: var(--radius-full); font-weight: 800; font-size: 16px;
      cursor: pointer; transition: all 0.2s; margin-top: 10px;
    }
    .btn-update:hover:not(:disabled) { background: var(--yellow-dark); transform: scale(1.02); }
    .btn-update:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Error state banner — shown when email/token params are missing */
    .invalid-link-banner {
      background: #fff0f0; border: 2px solid #ffbcbc; border-radius: var(--radius-md);
      padding: 20px; margin-bottom: 20px; font-size: 14px; color: #c0392b;
      display: none;
    }

    #statusMsg { margin-top: 15px; font-size: 14px; font-weight: 600; min-height: 22px; }

    .back-to-login {
      display: inline-block; margin-top: 20px; color: var(--teal);
      text-decoration: none; font-size: 14px; font-weight: 700; transition: 0.3s;
    }
    .back-to-login:hover { opacity: 0.75; }

    /* Ground */
    .ground { position: absolute; bottom: 0; width: 100%; height: 60px; z-index: 1; }
    .grass  { background: linear-gradient(to bottom,#7ec850,#5ca830); height: 40px; position: absolute; bottom: 0; width: 100%; }
    .fence  {
      height: 30px;
      background: repeating-linear-gradient(90deg,white 0,white 15px,transparent 15px,transparent 25px);
      border-top: 5px solid white; position: absolute; bottom: 30px; width: 100%;
    }
  </style>
</head>
<body>
<div class="page">
  <div class="reset-card">
    <h2 class="card-title">🔐 Growia Security</h2>
    <p class="card-subtitle">Enter your new password below</p>

    <!-- Shown only when URL params are missing / malformed -->
    <div class="invalid-link-banner" id="invalidLinkBanner">
      ⚠️ This reset link is invalid or has expired.<br>
      Please request a new one from the login page.
    </div>

    <form id="resetForm">
      <div class="form-group">
        <label class="form-label" for="newPass">New Magic Password</label>
        <input
          type="password" id="newPass" class="form-input"
          placeholder="Enter 6 or more characters"
          oninput="checkStrength()"
          autocomplete="new-password"
        >
        <span class="error-msg" id="error-newPass"></span>
        <div class="strength-meter"><div id="strengthBar" class="strength-bar"></div></div>
        <small id="strengthText" class="strength-text"></small>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirmPass">Confirm Magic Password</label>
        <input
          type="password" id="confirmPass" class="form-input"
          placeholder="Confirm your password"
          autocomplete="new-password"
        >
        <span class="error-msg" id="error-confirmPass"></span>
      </div>

      <button type="submit" class="btn-update" id="submitBtn">Update and Grow 🌱</button>
    </form>

    <div id="statusMsg"></div>
    <a href="#" id="backLink" class="back-to-login">← Back to Login</a>
  </div>

  <div class="ground">
    <div class="fence"></div>
    <div class="grass"></div>
  </div>
</div>

<script src="script.js"></script>
<script>
  /* ── Read URL params injected by the backend forgot-password email ── */
  const params   = new URLSearchParams(window.location.search);
  const email    = params.get('email')   || '';
  const token    = params.get('token')   || '';
  const userType = (params.get('type')   || 'parent').toLowerCase();

  /* ── Validate that we have the required params ─────────────────── */
  // FIX: previously the form would silently submit with empty email/token
  // and get a confusing backend error. Now we block the form entirely.
  if (!email || !token) {
    document.getElementById('invalidLinkBanner').style.display = 'block';
    document.getElementById('resetForm').style.display = 'none';
    document.getElementById('statusMsg').style.display = 'none';
  }

  /* ── Configure back link based on account type ─────────────────── */
  const backLink = document.getElementById('backLink');
  if (userType === 'child') {
    backLink.href        = 'child_login.html';
    backLink.textContent = '← Back to Child Login';
  } else {
    backLink.href        = 'parent-login.html';
    backLink.textContent = '← Back to Parent Login';
  }

  /* ── Password strength meter ──────────────────────────────────── */
  function checkStrength() {
    const pass = document.getElementById('newPass').value;
    const bar  = document.getElementById('strengthBar');
    const text = document.getElementById('strengthText');

    if (!pass) {
      bar.style.width = '0'; text.textContent = '';
    } else if (pass.length < 6) {
      bar.style.cssText = 'width:30%;background:#ff4d4d';
      text.textContent  = 'At least 6 characters required';
    } else if (pass.length < 10) {
      bar.style.cssText = 'width:65%;background:#f5a623';
      text.textContent  = 'Good password';
    } else {
      bar.style.cssText = 'width:100%;background:#2ecc71';
      text.textContent  = 'Strong password! ✅';
    }
  }

  /* ── Form submit ──────────────────────────────────────────────── */
  document.getElementById('resetForm').addEventListener('submit', async e => {
    e.preventDefault();
    clearFormErrors();

    const newPassword     = document.getElementById('newPass').value;
    const confirmPassword = document.getElementById('confirmPass').value;
    const status          = document.getElementById('statusMsg');
    const btn             = document.getElementById('submitBtn');

    // Client-side validation
    let hasError = false;
    if (newPassword.length < 6) {
      showFieldError('newPass', 'Minimum 6 characters required');
      hasError = true;
    }
    if (!confirmPassword) {
      showFieldError('confirmPass', 'Please confirm your password');
      hasError = true;
    } else if (newPassword !== confirmPassword) {
      showFieldError('confirmPass', 'Passwords do not match');
      hasError = true;
    }
    if (hasError) return;

    btn.textContent = 'Updating…';
    btn.disabled    = true;
    status.textContent = '';

    try {
      // FIX: send PascalCase keys matching ResetPasswordDto exactly.
      // Backend: Email, Token, NewPassword, ConfirmPassword
      const response = await fetch(`${API_BASE_URL}/Auth/reset-password`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body:    JSON.stringify({
          Email:           email,
          Token:           token,
          NewPassword:     newPassword,
          ConfirmPassword: confirmPassword
        })
      });

      const result = await response.json().catch(() => ({}));

      if (response.ok) {
        status.style.color = '#2ecc71';
        status.textContent = result.message || 'Password updated successfully! ✅';
        btn.style.display  = 'none';

        // Redirect after 3 seconds
        setTimeout(() => {
          window.location.href = userType === 'child' ? 'child_login.html' : 'parent-login.html';
        }, 3000);
      } else {
        btn.disabled    = false;
        btn.textContent = 'Update and Grow 🌱';

        // Handle structured validation errors (e.g. from ModelState)
        if (result.errors && typeof result.errors === 'object') {
          Object.entries(result.errors).forEach(([key, msgs]) => {
            const fieldKey = key.charAt(0).toLowerCase() + key.slice(1);
            if (fieldKey === 'newPassword')     showFieldError('newPass',     Array.isArray(msgs) ? msgs[0] : msgs);
            else if (fieldKey === 'confirmPassword') showFieldError('confirmPass', Array.isArray(msgs) ? msgs[0] : msgs);
            else {
              // email or token errors → link is expired
              status.style.color = '#e74c3c';
              status.textContent = 'Reset link has expired. Please request a new one.';
            }
          });
        } else {
          status.style.color = '#e74c3c';
          status.textContent = result.message || 'Something went wrong. Please try again.';
        }
      }
    } catch {
      status.style.color = '#e74c3c';
      status.textContent = 'Connection error — is the API running?';
      btn.disabled    = false;
      btn.textContent = 'Update and Grow 🌱';
    }
  });
</script>
</body>
</html>
